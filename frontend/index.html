<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaw - Catálogo de Filmes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --cor-fundo-principal: #0b0c10;
            --cor-painel: #12141a;
            --cor-painel-hover: #1a1d26;
            --cor-destaque: #0080ff;
            --cor-texto: #ffffff;
            --cor-texto-secundario: #8c939d;
            --cor-borda: rgba(255, 255, 255, 0.06);
        }

        body {
            background-color: var(--cor-fundo-principal);
            color: var(--cor-texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        /* Foco visível para navegação por teclado */
        :focus-visible { outline: 2px solid var(--cor-destaque); outline-offset: 2px; }

        .sidebar-capsule {
            background-color: var(--cor-painel);
            border-right: 1px solid var(--cor-borda);
            width: 90px; min-width: 90px;
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 0; z-index: 10;
        }
        .sidebar-logo {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #0080ff, #0044cc);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.3rem; margin-bottom: 40px;
        }
        .sidebar-capsule .nav-link {
            color: var(--cor-texto-secundario);
            font-size: 0.75rem;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 10px 0; width: 100%;
            background: none; border: 0; border-left: 3px solid transparent;
            cursor: pointer; transition: 0.3s;
        }
        .sidebar-capsule .nav-link i { font-size: 1.4rem; margin-bottom: 4px; }
        .sidebar-capsule .nav-link:hover,
        .sidebar-capsule .nav-link.active {
            color: #ffffff;
            background: rgba(0, 128, 255, 0.08);
            border-left-color: var(--cor-destaque);
        }

        .main-content { background-color: var(--cor-fundo-principal); overflow-y: auto; flex-grow: 1; min-width: 0; }
        .top-header {
            background-color: rgba(18, 20, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--cor-borda);
            padding: 15px 30px; gap: 12px;
        }
        .search-input {
            background-color: #1a1d26 !important;
            border: 1px solid var(--cor-borda) !important;
            color: white !important;
            border-radius: 30px; padding: 10px 20px 10px 45px;
        }
        .search-input::placeholder { color: var(--cor-texto-secundario); }
        .search-wrapper { position: relative; max-width: 400px; width: 100%; }
        .search-wrapper i {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: var(--cor-texto-secundario); pointer-events: none;
        }

        .content-card {
            background-color: var(--cor-painel);
            border: 1px solid var(--cor-borda);
            border-radius: 14px; padding: 14px;
            transition: 0.3s; cursor: pointer; height: 100%;
        }
        .content-card:hover { background-color: var(--cor-painel-hover); transform: translateY(-4px); border-color: rgba(0, 128, 255, 0.3); }
        .movie-poster { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; background: #1a1d26; }

        .right-info-panel {
            background-color: var(--cor-painel);
            border-left: 1px solid var(--cor-borda);
            width: 400px; min-width: 400px;
            display: flex; flex-direction: column;
            padding: 24px; overflow-y: auto; transition: 0.3s;
        }
        .right-info-panel.collapsed {
            width: 0 !important; min-width: 0 !important; padding: 0 !important;
            overflow: hidden !important; border-left: none !important; opacity: 0; visibility: hidden;
        }
        .right-poster { width: 100%; height: 320px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: #1a1d26; }
        .sinopse-scroll { max-height: 120px; overflow-y: auto; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Responsivo: no mobile o painel vira uma camada sobre o conteúdo */
        @media (max-width: 991.98px) {
            .sidebar-capsule { width: 64px; min-width: 64px; padding: 20px 0; }
            .sidebar-logo { margin-bottom: 24px; }
            .top-header { padding: 12px 16px; flex-wrap: wrap; }
            .right-info-panel {
                position: fixed; top: 0; right: 0; bottom: 0;
                width: min(400px, 100%); min-width: 0; z-index: 1040;
                box-shadow: -8px 0 24px rgba(0, 0, 0, 0.5);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
            .content-card:hover { transform: none; }
        }
    </style>
</head>
<body>

    <div class="container-fluid vh-100 d-flex p-0">

        <!-- NAVBAR LATERAL -->
        <aside class="sidebar-capsule">
            <div class="sidebar-logo" aria-hidden="true">S</div>
            <nav class="nav flex-column align-items-center w-100" aria-label="Navegação principal">
                <button type="button" class="nav-link active" data-aba="home" aria-current="page"><i class="bi bi-house-door-fill" aria-hidden="true"></i>Início</button>
                <button type="button" class="nav-link" data-aba="minhaLista"><i class="bi bi-bookmark-fill" aria-hidden="true"></i>Minha Lista</button>
                <button type="button" class="nav-link" data-aba="dashboard"><i class="bi bi-bar-chart-fill" aria-hidden="true"></i>Dashboard</button>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="main-content flex-grow-1 d-flex flex-column">

            <header class="top-header d-flex justify-content-between align-items-center sticky-top">
                <h1 id="tituloSecao" class="h5 m-0 text-white fw-bold">Início</h1>
                <div class="search-wrapper" id="buscaWrapper">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <label for="inputBusca" class="visually-hidden">Pesquisar filmes</label>
                    <input type="search" id="inputBusca" class="form-control search-input" placeholder="Pesquisar filmes..." autocomplete="off">
                </div>
                <div class="text-secondary small"><i class="bi bi-person-circle text-white fs-5 me-1" aria-hidden="true"></i> Luiz Felipe</div>
            </header>

            <div class="p-4 flex-grow-1">

                <!-- ABA 1: HOME -->
                <section id="view-home" class="view-section active" aria-label="Início">
                    <div id="bannerDestaque" class="hero-banner mb-5 p-4 rounded-4 position-relative overflow-hidden d-flex flex-column justify-content-end" style="height: 300px; background: #16181d; border: 1px solid var(--cor-borda);">
                        <h2 id="bannerTitulo" class="text-white fw-bold display-6">Carregando...</h2>
                        <p id="bannerSinopse" class="text-light small">Aguarde...</p>
                    </div>
                    <h2 class="text-white h5 mb-4 fw-bold">Catálogo Geral</h2>
                    <div id="resultadoBusca" class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-4" aria-live="polite"></div>
                </section>

                <!-- ABA 2: MINHA LISTA -->
                <section id="view-minhaLista" class="view-section" aria-label="Minha Lista">
                    <h2 class="text-white h5 mb-4 fw-bold">Meus Filmes Salvos</h2>
                    <div id="containerMinhaLista" class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-4" aria-live="polite"></div>
                </section>

                <!-- ABA 3: DASHBOARD -->
                <section id="view-dashboard" class="view-section" aria-label="Dashboard">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                        <h2 class="text-white h5 m-0 fw-bold">Dashboard Analítico do TMDB</h2>
                        <div class="d-flex align-items-center gap-2">
                            <label for="seletorConjunto" class="text-secondary small m-0">Conjunto:</label>
                            <select id="seletorConjunto" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: 180px;">
                                <option value="Action">Ação</option>
                                <option value="Comedy">Comédia</option>
                                <option value="Drama">Drama</option>
                                <option value="Science Fiction">Ficção Científica</option>
                                <option value="Animation">Animação</option>
                                <option value="Horror">Terror</option>
                            </select>
                        </div>
                    </div>

                    <div id="dashboardAviso" class="text-secondary text-center py-3" role="status" aria-live="polite"></div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="p-4 rounded-4 h-100" style="background-color: var(--cor-painel); border: 1px solid var(--cor-borda);">
                                <h3 id="tituloGeneros" class="h6 text-white mb-3">Filmes por Gênero</h3>
                                <div style="position: relative; height: 260px;">
                                    <canvas id="chartGeneros" role="img" aria-label="Gráfico de rosca com a quantidade de filmes por gênero"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="p-4 rounded-4 h-100" style="background-color: var(--cor-painel); border: 1px solid var(--cor-borda);">
                                <h3 class="h6 text-white mb-3">Lançamentos por Ano</h3>
                                <div style="position: relative; height: 260px;">
                                    <canvas id="chartAnos" role="img" aria-label="Gráfico de barras com a quantidade de lançamentos por ano"></canvas>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="p-4 rounded-4" style="background-color: var(--cor-painel); border: 1px solid var(--cor-borda);">
                                <h3 class="h6 text-white mb-3">Distribuição por Faixas de Notas (0 a 10)</h3>
                                <div style="position: relative; height: 240px;">
                                    <canvas id="chartFaixasNotas" role="img" aria-label="Gráfico de barras com a distribuição de filmes por faixa de nota"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </main>

        <!-- PAINEL LATERAL DIREITO -->
        <aside class="right-info-panel" id="painelDetalhes" aria-label="Detalhes do filme">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="text-white h6 m-0 fw-bold">Detalhes</h2>
                <button id="btnTogglePainel" type="button" class="btn btn-sm btn-dark text-secondary rounded-circle" style="width: 32px; height: 32px; background: #1a1d26; border: 1px solid var(--cor-borda);" aria-expanded="true" aria-controls="painelConteudo" aria-label="Fechar painel de detalhes">
                    <i class="bi bi-chevron-right" id="iconeToggle" aria-hidden="true"></i>
                </button>
            </div>
            <div id="painelConteudo" class="d-flex flex-column align-items-center text-center my-auto" aria-live="polite">
                <p class="text-secondary small">Clique num filme para ver os detalhes.</p>
            </div>
        </aside>

    </div>

    <!-- Toasts de feedback -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1100;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js" defer></script>
</body>
</html>
